name: zh-TW spike - version packaging

# Throwaway check: does `<upstream>+zh-TW.N` survive bundling, upload and latest.json on all platforms?
on:
  push:
    branches: [spike/zh-tw-version]
  workflow_dispatch:

permissions:
  contents: write

env:
  ZH_TW_VERSION: 0.27.0+zh-TW.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ''
          # MSI rejects non-numeric build metadata, so Windows ships NSIS only.
          - platform: windows-latest
            args: --bundles nsis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev rpm
      - run: pnpm install --frozen-lockfile
      - name: Generate icons
        run: |
          pnpm icons
          pnpm --filter @angkorgit/desktop exec tauri icon src-tauri/icons/icon.png
      - name: Write config overlay with a throwaway updater key
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @angkorgit/desktop exec tauri signer generate --ci -p spike -w "$RUNNER_TEMP/spike.key" > /dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/spike.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=spike" >> "$GITHUB_ENV"
          cat > apps/desktop/src-tauri/tauri.zh-tw.conf.json <<EOF
          {
            "productName": "AngKorGit zh-TW",
            "version": "${ZH_TW_VERSION}",
            "identifier": "dev.angkorgit.zhtw",
            "plugins": {
              "updater": {
                "pubkey": "$(cat "$RUNNER_TEMP/spike.key.pub")",
                "endpoints": ["https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"]
              }
            }
          }
          EOF
          cat apps/desktop/src-tauri/tauri.zh-tw.conf.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v${{ env.ZH_TW_VERSION }}
          releaseName: 'AngKorGit zh-TW v${{ env.ZH_TW_VERSION }} (spike)'
          releaseDraft: true
          args: ${{ matrix.args }} --config src-tauri/tauri.zh-tw.conf.json
      - name: List bundle files
        if: always()
        shell: bash
        run: find apps/desktop/src-tauri/target -type f -path '*/bundle/*' -not -path '*/bundle/*/*/*/*' | sort
      - name: Inspect Linux package versions
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for f in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do dpkg-deb -f "$f" Package Version || true; done
          for f in apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm; do rpm -qp --queryformat 'rpm name=%{NAME} version=%{VERSION} release=%{RELEASE}\n' "$f" || true; done
      - name: Inspect macOS bundle version
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          for p in apps/desktop/src-tauri/target/*/release/bundle/macos/*.app/Contents/Info.plist; do
            plutil -p "$p" | grep -E 'CFBundle(ShortVersionString|Version|Identifier|Name)' || true
          done
      - name: Inspect Windows installer version
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $_.Name; $_.VersionInfo | Format-List ProductVersion, FileVersion, ProductName
          }
